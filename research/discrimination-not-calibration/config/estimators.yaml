# Generated by scripts/make_config.py. Edit that script, not this file:
# a hand edit here will be overwritten and will not be reflected in the
# design it is supposed to express.
estimators:
- estimator_id: cox_ph
  adapter: cox_ph
  params: {}
  assumptions: Proportional hazards; semi-parametric baseline; linear in the covariates
    on the log-hazard scale.
- estimator_id: weibull_aft
  adapter: weibull_aft
  params: {}
  assumptions: Fully parametric Weibull; monotone hazard; linear in the covariates
    on the log-time scale.
- estimator_id: random_survival_forest
  adapter: random_survival_forest
  params:
    n_estimators: 100
    min_samples_leaf: 15
    n_jobs: 1
  assumptions: None on the hazard's shape or proportionality; estimates a discrete
    hazard from the sample, so it needs data to do so.
- estimator_id: gradient_boosted
  adapter: gradient_boosted
  params:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
  assumptions: Proportional hazards through the partial-likelihood loss, but no assumption
    of linearity in the covariates.
