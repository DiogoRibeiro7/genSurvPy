[tool.poetry]
name = "gen_surv"
version = "2.0.1"
description = "Simulate survival data with a known truth: twelve models spanning proportional hazards, accelerated failure time, competing risks, cure fractions, recurrent events and multi-state processes"
authors = ["Diogo Ribeiro <diogo.debastos.ribeiro@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "gen_surv" }]
homepage = "https://github.com/DiogoRibeiro7/genSurvPy"
repository = "https://github.com/DiogoRibeiro7/genSurvPy"
documentation = "https://diogoribeiro7.github.io/genSurvPy/"
keywords = [
    "survival-analysis",
    "simulation",
    "synthetic-data",
    "cox-model",
    "accelerated-failure-time",
    "competing-risks",
    "recurrent-events",
    "multi-state-models",
    "cure-models",
    "markov-model",
    "time-dependent",
    "statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "^2.3.3"
pandas = "^2.3.3"
scipy = "^1.16.1"
typer = "^0.19.2"
click = "^8.3.0"
matplotlib = "^3.10.7"
lifelines = "^0.30.3"
pyarrow = ">=21,<26"
pyreadr = "^0.5.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<10.0.0"
pytest-cov = "^7.0.0"
pytest-benchmark = "^5.1.0"
python-semantic-release = "^10.4.1"
mypy = "^1.18.2"
invoke = ">=2.2.1,<4.0.0"
hypothesis = "^6.142.1"
tomli = "^2.3.0"
black = ">=25.9,<27.0"
isort = ">=7,<9"
flake8 = ">=6.1,<8.0"
scikit-survival = ">=0.25,<0.29"
pre-commit = "^4.3.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocstrings = { extras = ["python"], version = ">=0.26,<1.0" }

[tool.pytest.ini_options]
markers = [
    "slow: slow performance tests",
]

[tool.poetry.scripts]
gen_surv = "gen_surv.cli:app"

[tool.semantic_release]
version_source = "tag"
version_variable = ["pyproject.toml:tool.poetry.version"]
commit_version_number = true
changelog_file = "CHANGELOG.md"
upload_to_repository = false
branch = "main"
build_command = ""

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501", "W291", "W293", "W391", "E402", "E302", "E305"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "typer",
    "typer.models",
    "matplotlib",
    "matplotlib.*",
    "lifelines",
    "lifelines.*",
    "sklearn",
    "sklearn.*",
    "numpy",
    "numpy.*",
    "pandas",
    "pandas.*",
    "scipy",
    "scipy.*",
    "pyreadr",
    "sksurv",
    "sksurv.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
