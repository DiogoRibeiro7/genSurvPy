name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

# Adding `develop` doubles the trigger surface, so supersede rather than pile
# up: a second push to a pull request cancels the first run. Only pull
# requests are cancelled -- a run on `main`, `develop` or a tag is a record of
# whether that commit was good and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not cancel the others: knowing whether a
      # failure is version-specific is most of the diagnosis. On the v3.0.0
      # tag, 3.11 failed and took 3.12 and 3.13 down as cancelled, which hid
      # that the cause had nothing to do with the version.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # A pyproject change without a matching `poetry lock` makes the committed
      # lock a lie and the cache key meaningless. Fail here rather than three
      # steps later on a confusing resolution error.
      - name: Verify the lock file matches pyproject.toml
        run: poetry check --lock

      # The research studies under research/ are collected by the same pytest
      # run, so their dependencies must be installed. Before this they were
      # not: PyYAML resolved only because pre-commit happened to pull it in,
      # and the research config loader would have failed the moment that
      # changed.
      - name: Install dependencies
        run: poetry install --with dev,research --no-interaction

      - name: Check runtime dependencies
        run: |
          poetry run python - <<'PY'
          # `import importlib` does not bind the `util` submodule. This read
          # worked only when something else had already imported it, which is
          # why it passed on main and raised on the v3.0.0 tag from the very
          # same commit.
          import importlib.util
          import sys
          missing = [m for m in ("pandas",) if importlib.util.find_spec(m) is None]
          if missing:
              print("Missing dependencies:", ", ".join(missing))
              sys.exit(1)
          PY

      - name: Run tests with coverage
        run: poetry run pytest --cov=gen_surv --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-3.11-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-3.11-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev,research --no-interaction

      - name: Run pre-commit checks
        run: poetry run pre-commit run --all-files
