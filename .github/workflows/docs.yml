name: Documentation Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Adding `develop` doubles the trigger surface, so supersede rather than pile
# up: a second push to a pull request cancels the first run. Only pull
# requests are cancelled -- a run on `main`, `develop` or a tag is a record of
# whether that commit was good and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-3.11-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-3.11-
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install --with docs
      - name: Build documentation
        # --strict turns warnings into errors: a broken internal link, a page
        # missing from the nav, or an unresolved mkdocstrings reference fails
        # the build rather than shipping quietly.
        run: poetry run mkdocs build --strict --site-dir site
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
