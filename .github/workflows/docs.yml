name: Documentation Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-3.11-${{ hashFiles('**/poetry.lock') }}
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install --with docs
      - name: Build documentation
        # --strict turns warnings into errors: a broken internal link, a page
        # missing from the nav, or an unresolved mkdocstrings reference fails
        # the build rather than shipping quietly.
        run: poetry run mkdocs build --strict --site-dir site
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
